plugins {
    id 'com.android.application'
}
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.steamdeck.launcher'
    compileSdk 34
    // The NDK is pinned by property so CI can hand in whatever the runner already has rather than
    // downloading a second copy; see gradle.properties.
    ndkVersion project.findProperty('ndkVersion') ?: '27.3.13750724'

    defaultConfig {
        applicationId "com.steamdeck.launcher"
        minSdkVersion 26
        // 28 is not a leftover. An app on targetSdk 29+ runs in a domain that may not execute a
        // file out of its own data directory, and this app's entire job is to exec a rootfs:
        // proot, gamescope, the Steam client and everything it launches all live under files/.
        targetSdkVersion 28
        versionCode 5
        versionName "0.1.4"

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        // AOSP testkey (android@android.com), the same key Bannerlator ships with. It is publicly
        // known, so it proves nothing about who built the apk — what it buys is ONE stable
        // signature: every build installs over the last one instead of asking the user to
        // uninstall first. v1 (JAR) + v2 + v3 so every installer and Android version accepts it.
        testkey {
            storeFile file("${rootDir}/keystore/testkey.p12")
            storeType "PKCS12"
            storePassword "android"
            keyAlias "testkey"
            keyPassword "android"
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.testkey
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.testkey
        }
    }

    lint {
        // targetSdk 28 is deliberate and structural: an app on 29+ may not execute a file out of
        // its own data directory, and executing a rootfs is the whole of what this app does. Lint
        // fails a release build over it because Google Play will not accept an sdk that old —
        // true, and not something this app can trade away. Every other check stays on.
        disable 'ExpiredTargetSdkVersion'
    }

    packagingOptions {
        jniLibs {
            // The PulseAudio daemon is executed from the native library directory and its
            // libraries are read out of the apk by the class loader: both want the old,
            // uncompressed-and-extracted layout.
            useLegacyPackaging = true
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // The runtime tarball is a zstd-compressed tar.
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.apache.commons:commons-compress:1.20'
    // The UI: every menu, dialog and overlay is Compose. The session's SurfaceView and the
    // on-screen pad are Views underneath it, which is what they are in every Compose app.
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.8.2'
    // The File Manager, Bannerlator's: its icon set, image thumbnails and the coroutines it
    // copies on. Same versions as Bannerlator so the screen stays a straight copy.
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
