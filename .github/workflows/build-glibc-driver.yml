name: Build glibc PanVK driver

# Builds the glibc (Linux guest) PanVK driver for Mali-G720 on the kbase
# kernel interface. The Android (bionic) driver ships in the APK; this one
# is what vkcube, vulkaninfo, and Proton/DXVK use inside the Linux guest.
# Output: PanVK-kbase-glibc-DroidDeck.zip (imported via GPU drivers > Linux runtime driver).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/panvk/**
      - .github/workflows/build-glibc-driver.yml

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      PANVK_SRC_REPO: https://github.com/zenithblue-oss/panvk-kbase-android.git
      PANVK_SRC_BRANCH: main
      PANVK_SRC_COMMIT: 0183fc489f17156a6b266360b0c296cfd9109da1
      ANDROID_NDK_HOME: ${{ github.workspace }}/ndk
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison flex glslang-tools spirv-tools \
            pkg-config python3-venv wayland-scanner curl git zstd

      - name: Set up Android NDK (for ld.lld / llvm-ar)
        run: |
          # Match the NDK major used by the APK build; only the LLVM linker+tools are needed.
          NDK_VER="r27"
          curl -sSfLo ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip"
          unzip -q ndk.zip
          mv android-ndk-* ndk
          ls ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld

      - name: Build glibc PanVK
        run: |
          set -euo pipefail
          bash tools/panvk/build-panvk-kbase.sh "${{ github.workspace }}/panvk-work"
          ls -la "${{ github.workspace }}/panvk-work/PanVK-kbase-glibc-DroidDeck.zip"
          unzip -l "${{ github.workspace }}/panvk-work/PanVK-kbase-glibc-DroidDeck.zip"

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: panvk-glibc-driver
          path: ${{ github.workspace }}/panvk-work/PanVK-kbase-glibc-DroidDeck.zip
          retention-days: 90
