org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# CI is the only thing that builds this repo and its minutes are billed, so every cache Gradle
# offers is on: task outputs are reused across runs from the cache the CI action restores, the
# configuration phase is skipped when nothing about the build scripts changed, and independent
# tasks run together.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# The NDK the compositor is built with. CI passes the one the runner has installed
# (-PndkVersion=…); this is the fallback for a local build.
ndkVersion=27.3.13750724
